
name: Java

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432/5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: purchasedb
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      env:
        APP_NAME: purchase-service
        SERVER_PORT: 8080
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: purchasedb
        DB_USER: postgres
        DB_PASSWORD: postgres
        DDL_AUTO: create-drop
        SHOW_SQL: 'false'
        FORMAT_SQL: 'false'
        DB_TIMEZONE: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Give Maven Wrapper permission
        run: chmod +x ./mvnw

      - name: Run Tests
        run: ./mvnw -B clean verify

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Give Maven Wrapper permission
        run: chmod +x ./mvnw

      - name: Build
        run: ./mvnw -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: purchase-service-jar
          path: target/*.jar
          if-no-files-found: error

  docker:
    name: Build Docker Image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker.yml
    secrets: inherit
